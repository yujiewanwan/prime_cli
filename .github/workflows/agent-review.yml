name: Agent Review Gate

on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited, ready_for_review]
  workflow_run:
    workflows: [Review Notification]
    types: [completed]
  issue_comment:
    types: [created, edited, deleted]
  issues:
    types: [edited, labeled, unlabeled, closed, reopened]
  workflow_dispatch:
    inputs:
      pr:
        description: 待重新核实的 PR 编号
        required: true
        type: string

permissions:
  contents: read
  issues: read
  pull-requests: read
  statuses: write

# 每次读取全部 Open PR，队列事件合并也不会遗漏其他 PR 的状态变化。
concurrency:
  group: agent-review-gate
  cancel-in-progress: false

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      # 只运行已合并默认分支的可信校验，绝不 checkout 或执行 PR 代码。
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/github-script@v9
        with:
          script: |
            const { run } = require('./.github/scripts/agent-review-gate.cjs');
            await run({ github, context, core });
