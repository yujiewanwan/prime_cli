name: issue-gate

on:
  issues:
    types: [labeled]

permissions:
  contents: read
  issues: write

jobs:
  issue-gate:
    if: github.event.label.name == 'agent:ready'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: validate
        run: echo "result=$(node scripts/github-delivery-gate.mjs issue \"$GITHUB_EVENT_PATH\")" >> "$GITHUB_OUTPUT"
      - uses: actions/github-script@v7
        env:
          GATE_RESULT: ${{ steps.validate.outputs.result }}
        with:
          script: |
            const result = JSON.parse(process.env.GATE_RESULT);
            const marker = `<!-- primecli-issue-gate:${context.issue.number}:${result.message} -->`;
            const { data: comments } = await github.rest.issues.listComments({
              ...context.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });
            if (!comments.some((comment) => comment.body.includes(marker))) {
              await github.rest.issues.createComment({
                ...context.repo,
                issue_number: context.issue.number,
                body: `${marker}\n${result.message}`,
              });
            }
            if (!result.passed) {
              core.setFailed(result.message);
            }
