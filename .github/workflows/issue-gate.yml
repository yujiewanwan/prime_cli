name: Issue Gate

on:
  issues:
    types: [opened, edited, labeled, unlabeled, reopened]

permissions:
  contents: read
  issues: read

concurrency:
  group: delivery-issue-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  issue-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/github-script@v9
        with:
          script: |
            const { runIssue } = require('./.github/scripts/delivery-contract.cjs');
            await runIssue({ github, context, core });
