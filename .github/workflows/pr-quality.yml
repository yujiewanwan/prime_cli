name: PR Quality

on:
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review]

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  pr-quality:
    name: pr-quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test .github/scripts/*.test.cjs
      - uses: actions/github-script@v9
        with:
          script: |
            const { runPullRequest } = require('./.github/scripts/delivery-contract.cjs');
            await runPullRequest({ github, context, core });
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
